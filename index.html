<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Domingo Sabio - Gestión Verde Pastel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { 
            --primary: #77b28c; 
            --primary-dark: #5f9673;
            --success: #2ecc71; 
            --danger: #e74c3c; 
            --bg: #f4f7f6; 
            --card: #ffffff; 
            --text: #2c3e50; 
            --ws: #25D366;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; padding-bottom: 120px; }
        
        #vistaLogin { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; padding: 40px 30px; border-radius: 25px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .login-box h2 { color: var(--primary-dark); margin-bottom: 5px; font-weight: 900; text-transform: uppercase; }
        
        .header { background: var(--primary); color: white; padding: 25px 15px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        .header p { margin: 5px 0 0; opacity: 0.9; font-size: 14px; font-weight: 500; }
        
        .container { padding: 20px 15px; max-width: 550px; margin: auto; }
        .seccion-titulo { font-size: 12px; font-weight: 800; color: #7f8c8d; margin: 25px 0 10px 5px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; }
        .seccion-titulo::after { content: ""; flex: 1; height: 1px; background: #ddd; margin-left: 10px; }

        .card-servicio { background: var(--card); border-radius: 18px; padding: 22px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; transition: 0.3s; }
        .card-servicio:active { transform: scale(0.97); background: #f0f7f4; }
        .info-ser { cursor: pointer; flex: 1; }
        .info-ser h3 { margin: 0; font-size: 17px; color: var(--primary-dark); font-weight: 800; text-transform: uppercase; }
        .info-ser p { margin: 5px 0 0; font-size: 13px; color: #7f8c8d; font-weight: 600; }
        .info-ser .total-tag { color: var(--primary-dark); font-weight: 800; font-size: 14px; margin-top: 3px; display: block; }
        
        .btn-delete-card { background: #fee; color: var(--danger); border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; margin-left: 10px; }

        .meses-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .mes-chip { background: #f0f0f0; padding: 12px 5px; border-radius: 12px; font-size: 12px; font-weight: 800; text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .mes-chip.selected { background: var(--primary); color: white; border-color: var(--primary-dark); }

        .mosaico-meses { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 10px; }
        .btn-mes-card { background: white; border: 2px solid #eef2f0; padding: 20px 10px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .btn-mes-card h4 { margin: 0 0 10px 0; color: var(--primary-dark); font-size: 18px; text-transform: uppercase; font-weight: 900; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .resumen-mes { font-size: 11px; text-align: left; padding: 0 10px; color: #7f8c8d; line-height: 1.5; }
        .resumen-mes b { color: var(--text); }
        .resumen-mes .cobrado { color: var(--success); font-weight: 800; }

        .tabs-container { background: white; position: sticky; top: 78px; z-index: 90; display: flex; border-bottom: 2px solid #eee; margin-bottom: 10px; }
        .tab { flex: 1; text-align: center; padding: 18px; font-weight: 800; font-size: 13px; color: #95a5a6; cursor: pointer; text-transform: uppercase; }
        .tab.active { color: var(--primary-dark); border-bottom: 4px solid var(--primary); background: #f4faf6; }

        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 18px; border-radius: 15px; border: 1px solid #e0e0e0; }
        .stat-item { font-weight: 700; font-size: 13px; color: #7f8c8d; text-align: center; flex: 1; }
        .stat-item span { color: var(--primary-dark); font-size: 20px; font-weight: 900; display: block; margin-top: 5px; }

        .card-alumno { background: var(--card); padding: 18px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .nombre-alumno { font-size: 14px; font-weight: 700; color: #34495e; text-transform: uppercase; flex: 1; }
        
        .acciones-alumno { display: flex; gap: 10px; }
        .btn-ws-alumno { background: var(--ws); color: white; border: none; width: 45px; height: 45px; border-radius: 12px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-accion { width: 48px; height: 48px; border-radius: 14px; border: 2px solid #eee; background: #fafafa; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .btn-accion.pagado { background: var(--primary); border-color: var(--primary); color: white; border-radius: 50%; }

        .fab { position: fixed; bottom: 30px; right: 25px; width: 65px; height: 65px; background: var(--primary); border-radius: 50%; color: white; font-size: 32px; border: none; box-shadow: 0 6px 20px rgba(119, 178, 140, 0.4); cursor: pointer; z-index: 1000; display: flex; align-items: center; justify-content: center; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(3px); }
        .modal-content { background: white; width: 85%; max-width: 400px; border-radius: 25px; padding: 30px; animation: slideUp 0.3s ease; }
        
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .btn-principal { background: var(--primary); color: white; width: 100%; border: none; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .btn-danger-mod { background: var(--danger); color: white; width: 100%; border: none; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 15px; }
        
        .back-btn { position: absolute; left: 15px; top: 25px; background: rgba(255,255,255,0.3); border: none; width: 42px; height: 42px; border-radius: 12px; color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .hidden { display: none !important; }
        .footer-premium { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; z-index: 80; align-items: center; }
        .btn-ws-grupal { background: var(--ws); color: white; border: none; width: 100%; max-width: 520px; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .recordar-box { display: flex; align-items: center; gap: 10px; margin: 15px 0; font-size: 14px; color: #7f8c8d; font-weight: 600; cursor: pointer; justify-content: center; }
    </style>
</head>
<body>

    <div id="vistaLogin">
        <div class="login-box">
            <h2>HOLA 👋</h2>
            <p style="color:#7f8c8d; font-size: 14px; margin-bottom: 20px;">Ingresa para gestionar tu aula</p>
            <input type="email" id="logEmail" placeholder="Correo">
            <input type="password" id="logPass" placeholder="Contraseña">
            <label class="recordar-box"><input type="checkbox" id="chkRecordar" checked> Mantener sesión iniciada</label>
            <button class="btn-principal" onclick="manejarLogin()" id="btnLogin">ENTRAR AL SISTEMA</button>
            <p id="logError" style="color:var(--danger); font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <div id="appContent" class="hidden">
        <div id="modalNuevo" class="modal-overlay">
            <div class="modal-content">
                <h2 style="text-align:center; color:var(--primary-dark);">Nuevo Control</h2>
                <input type="text" id="newNombre" placeholder="Título (ej: Pensión 2026)">
                <input type="number" id="newMonto" placeholder="Monto S/">
                <div class="meses-grid">
                    <div class="mes-chip" onclick="toggleMes(this, 'marzo')">MAR</div>
                    <div class="mes-chip" onclick="toggleMes(this, 'abril')">ABR</div>
                    <div class="mes-chip" onclick="toggleMes(this, 'mayo')">MAY</div>
                    <div class="mes-chip" onclick="toggleMes(this, 'junio')">JUN</div>
                    <div class="mes-chip" onclick="toggleMes(this, 'julio')">JUL</div>
                    <div class="mes-chip" onclick="toggleMes(this, 'agosto')">AGO</div>
                    <div class="mes-chip" onclick="toggleMes(this, 'septiembre')">SET</div>
                    <div class="mes-chip" onclick="toggleMes(this, 'octubre')">OCT</div>
                    <div class="mes-chip" onclick="toggleMes(this, 'noviembre')">NOV</div>
                    <div class="mes-chip" onclick="toggleMes(this, 'diciembre')">DIC</div>
                </div>
                <button class="btn-principal" onclick="crearServiciosMultiples()">GENERAR</button>
                <button onclick="cerrarModalNuevo()" style="width:100%; background:none; border:none; color:#95a5a6; margin-top:15px; cursor:pointer;">Cancelar</button>
            </div>
        </div>

        <div id="modalConfirmar" class="modal-overlay">
            <div class="modal-content">
                <h2 id="confTitulo" style="text-align:center; color:var(--primary-dark);">Confirmar</h2>
                <p id="confCuerpo" style="text-align:center; color: #555;"></p>
                <button class="btn-principal" id="btnAceptarConf">ACEPTAR</button>
                <button onclick="cerrarModal('modalConfirmar')" style="width:100%; background:none; border:none; color:#95a5a6; margin-top:15px; cursor:pointer;">Volver</button>
            </div>
        </div>

        <div class="header">
            <button id="btnBack" class="back-btn" style="display:none" onclick="navegarAtras()">←</button>
            <h1 id="mainTitle">DOMINGO SABIO</h1>
            <p id="subTitle">Gestión Verde 2026</p>
        </div>

        <div id="vistaNivel1" class="container">
            <div class="seccion-titulo">Servicios Registrados</div>
            <div id="renderServicios"></div>
            <button class="fab" onclick="abrirModal('modalNuevo')">+</button>
            <button onclick="cerrarSesion()" style="width:100%; background:none; border:none; color:#95a5a6; margin-top:40px; font-weight:bold; cursor:pointer;">CERRAR SESIÓN</button>
        </div>

        <div id="vistaNivel2" class="container hidden">
            <div class="seccion-titulo">Seleccione un Mes</div>
            <div id="renderMosaico" class="mosaico-meses"></div>
        </div>

        <div id="vistaNivel3" class="hidden">
            <div class="tabs-container">
                <div id="tabPen" class="tab active" onclick="cambiarTab('pendientes')">Pendientes</div>
                <div id="tabPag" class="tab" onclick="cambiarTab('pagados')">Pagados ✅</div>
            </div>
            <div class="container">
                <div class="stats-bar">
                    <div class="stat-item">Recaudado <span id="statMonto">S/ 0</span></div>
                    <div class="stat-item">Faltantes <span id="statFaltan">0</span></div>
                </div>
                <div id="renderAlumnos"></div>
            </div>
            <div class="footer-premium">
                <button class="btn-ws-grupal" onclick="enviarAvisoGrupal()">📢 AVISO GRUPAL</button>
                <button onclick="generarPDFConTrazabilidad()" style="background:none; border:none; color:#7f8c8d; font-weight:800; cursor:pointer; text-decoration:underline;">DESCARGAR REPORTE PDF</button>
            </div>
        </div>
    </div>

    <script>
        const { createClient } = supabase;
        const SB_URL = 'https://qjillkydcyacgrdkknqx.supabase.co'; 
        const SB_KEY = 'sb_publishable_TOAEc_Vhg5zYVf6ue7HEuA_GjcB3Bug'; 
        const client = createClient(SB_URL, SB_KEY);

        let serviciosTotal = []; let alumnos = []; let pagosIDs = []; let todosLosPagos = [];
        let servicioActivo = null; let tabActual = 'pendientes';
        let nivelActual = 1; let userSession = null;
        let mesesSeleccionados = [];

        async function manejarLogin() {
            const btn = document.getElementById('btnLogin');
            let userVal = document.getElementById('logEmail').value.trim();
            const pass = document.getElementById('logPass').value.trim();
            const mantener = document.getElementById('chkRecordar').checked;
            if (!userVal.includes('@')) userVal += "@aula.com";
            btn.innerText = "VERIFICANDO...";
            const { data, error } = await client.auth.signInWithPassword({ email: userVal, password: pass, options: { persistSession: mantener } });
            if(error) { document.getElementById('logError').innerText = "Usuario o clave incorrectos"; btn.innerText = "ENTRAR AL SISTEMA"; return; }
            userSession = data.user;
            await iniciarApp();
        }

        async function iniciarApp() {
            document.getElementById('vistaLogin').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            const { data } = await client.from('alumnos').select('*').order('nombres_y_apellidos');
            alumnos = data || [];
            await cargarServicios();
        }

        async function revisarSesionActiva() {
            const { data: { session } } = await client.auth.getSession();
            if (session) { userSession = session.user; await iniciarApp(); }
        }

        async function cerrarSesion() { await client.auth.signOut(); location.reload(); }

        // CARGA DE DATOS CON RESUMEN TOTAL
        async function cargarServicios() {
            // Cargar servicios y todos los pagos para calcular totales
            const resS = await client.from('servicios').select('*').order('created_at', { ascending: false });
            const resP = await client.from('pagos').select('*');
            serviciosTotal = resS.data || [];
            todosLosPagos = resP.data || [];

            const nombresUnicos = [...new Set(serviciosTotal.map(s => s.nombre))];
            const container = document.getElementById('renderServicios');
            
            container.innerHTML = nombresUnicos.length ? nombresUnicos.map(n => {
                // Calcular recaudado total del servicio (Suma de todos sus meses)
                const idsMeses = serviciosTotal.filter(s => s.nombre === n).map(s => s.id);
                const countPagos = todosLosPagos.filter(p => idsMeses.includes(p.servicio_id)).length;
                const montoServicio = serviciosTotal.find(s => s.nombre === n).monto;
                const totalRecaudado = countPagos * montoServicio;

                return `
                <div class="card-servicio">
                    <div class="info-ser" onclick="irANivel2('${n}')">
                        <h3>${n}</h3>
                        <span class="total-tag">Recaudado Total: S/ ${totalRecaudado}</span>
                        <p>Ver meses disponibles</p>
                    </div>
                    <button class="btn-delete-card" onclick="preguntarBorrarServicio('${n}')">🗑️</button>
                </div>`;
            }).join('') : '<p style="text-align:center; padding:50px; color:#bdc3c7;">Presione (+) para crear.</p>';
        }

        function preguntarBorrarServicio(nombre) {
            document.getElementById('confTitulo').innerText = "BORRAR CONTROL";
            document.getElementById('confCuerpo').innerHTML = `¿Eliminar <b>${nombre.toUpperCase()}</b>?<br>Se borrarán todos sus meses asociados.`;
            document.getElementById('btnAceptarConf').className = "btn-danger-mod";
            document.getElementById('modalConfirmar').style.display = 'flex';
            document.getElementById('btnAceptarConf').onclick = async () => {
                cerrarModal('modalConfirmar');
                await client.from('servicios').delete().eq('nombre', nombre);
                await cargarServicios();
            };
        }

        function toggleMes(el, mes) {
            el.classList.toggle('selected');
            if(mesesSeleccionados.includes(mes)) mesesSeleccionados = mesesSeleccionados.filter(m => m !== mes);
            else mesesSeleccionados.push(mes);
        }

        async function crearServiciosMultiples() {
            const n = document.getElementById('newNombre').value;
            const m = document.getElementById('newMonto').value;
            if(!n || !m || !mesesSeleccionados.length) return alert("Complete los datos y seleccione meses.");
            const { error } = await client.from('servicios').insert(mesesSeleccionados.map(mes => ({ nombre: n, monto: m, mes: mes })));
            if(error) return alert(error.message);
            cerrarModalNuevo(); await cargarServicios();
        }

        function cerrarModalNuevo() {
            cerrarModal('modalNuevo');
            document.querySelectorAll('.mes-chip').forEach(c => c.classList.remove('selected'));
            mesesSeleccionados = [];
        }

        // NIVELES DE NAVEGACIÓN
        function irANivel2(nombre) {
            nivelActual = 2;
            document.getElementById('vistaNivel1').classList.add('hidden');
            document.getElementById('vistaNivel2').classList.remove('hidden');
            document.getElementById('btnBack').style.display = 'flex';
            document.getElementById('mainTitle').innerText = nombre.toUpperCase();
            
            const meses = serviciosTotal.filter(s => s.nombre === nombre).sort((a,b) => a.id - b.id);
            const totalAlumnos = alumnos.length;

            document.getElementById('renderMosaico').innerHTML = meses.map(s => {
                const pagados = todosLosPagos.filter(p => p.servicio_id === s.id).length;
                const pendientes = totalAlumnos - pagados;
                const totalSoles = totalAlumnos * s.monto;
                const cobradoSoles = pagados * s.monto;

                return `
                <div class="btn-mes-card" onclick="irANivel3(${s.id})">
                    <h4>${s.mes.substring(0,3)}</h4>
                    <div class="resumen-mes">
                        <b>Total:</b> S/ ${totalSoles}<br>
                        <span class="cobrado"><b>Cobrado:</b> S/ ${cobradoSoles}</span><br>
                        <b>Faltan:</b> ${pendientes} alumnos
                    </div>
                </div>`;
            }).join('');
        }

        async function irANivel3(idServicio) {
            nivelActual = 3;
            servicioActivo = serviciosTotal.find(s => s.id === idServicio);
            document.getElementById('vistaNivel2').classList.add('hidden');
            document.getElementById('vistaNivel3').classList.remove('hidden');
            document.getElementById('subTitle').innerText = `MES: ${servicioActivo.mes.toUpperCase()}`;
            await actualizarListaPagos();
        }

        function navegarAtras() {
            if(nivelActual === 3) { nivelActual = 2; document.getElementById('vistaNivel3').classList.add('hidden'); document.getElementById('vistaNivel2').classList.remove('hidden'); document.getElementById('subTitle').innerText = "Gestión Verde 2026"; }
            else if(nivelActual === 2) { 
                nivelActual = 1; 
                document.getElementById('vistaNivel2').classList.add('hidden'); 
                document.getElementById('vistaNivel1').classList.remove('hidden'); 
                document.getElementById('btnBack').style.display = 'none'; 
                document.getElementById('mainTitle').innerText = "DOMINGO SABIO";
                cargarServicios(); // Recargar para actualizar totales
            }
        }

        async function actualizarListaPagos() {
            const { data } = await client.from('pagos').select('alumno_id').eq('servicio_id', servicioActivo.id);
            pagosIDs = data ? data.map(p => p.alumno_id) : [];
            renderAlumnos();
        }

        function renderAlumnos() {
            const container = document.getElementById('renderAlumnos');
            container.innerHTML = "";
            const filtrados = alumnos.filter(al => (tabActual === 'pagados' ? pagosIDs.includes(al.identificacion) : !pagosIDs.includes(al.identificacion)));
            document.getElementById('statMonto').innerText = `S/ ${pagosIDs.length * servicioActivo.monto}`;
            document.getElementById('statFaltan').innerText = alumnos.length - pagosIDs.length;
            
            filtrados.forEach(al => {
                const esP = tabActual === 'pagados';
                container.innerHTML += `
                <div class="card-alumno">
                    <div class="nombre-alumno">${al.nombres_y_apellidos}</div>
                    <div class="acciones-alumno">
                        ${!esP ? `<button class="btn-ws-alumno" onclick="enviarWAPrivado('${al.nombres_y_apellidos}')">WA</button>` : ''}
                        <button class="btn-accion ${esP ? 'pagado' : ''}" onclick="abrirConfirmacionPago(${al.identificacion}, '${al.nombres_y_apellidos}', ${esP})">
                            ${esP ? '🔄' : '○'}
                        </button>
                    </div>
                </div>`;
            });
        }

        function abrirConfirmacionPago(id, nom, yaP) {
            const titulo = yaP ? "Anular Pago" : "Confirmar Pago";
            const mensaje = yaP 
                ? `¿Estás seguro de <b>ANULAR</b> el pago de <b>${nom}</b>?` 
                : `¿Confirmas registrar el pago de <b>${nom}</b>?`;
            
            document.getElementById('confTitulo').innerText = titulo;
            document.getElementById('confCuerpo').innerHTML = mensaje;
            document.getElementById('btnAceptarConf').className = yaP ? "btn-danger-mod" : "btn-principal";
            document.getElementById('modalConfirmar').style.display = 'flex';
            
            document.getElementById('btnAceptarConf').onclick = async () => {
                cerrarModal('modalConfirmar');
                if(yaP) await client.from('pagos').delete().eq('alumno_id', id).eq('servicio_id', servicioActivo.id);
                else await client.from('pagos').insert([{ alumno_id: id, servicio_id: servicioActivo.id }]);
                await actualizarListaPagos();
            };
        }

        function enviarWAPrivado(nombre) {
            const msj = `Hola, recordamos que el pago de ${servicioActivo.nombre} (${servicioActivo.mes.toUpperCase()}) de ${nombre} está pendiente. Monto: S/ ${servicioActivo.monto}.`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msj)}`);
        }

        function enviarAvisoGrupal() {
            const faltantes = alumnos.length - pagosIDs.length;
            const msj = `📢 *AVISO DE TESORERÍA*\nEstimados padres, informamos que contamos con *${faltantes} pagos pendientes* para el mes de ${servicioActivo.mes.toUpperCase()}. Agradecemos su regularización.`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msj)}`);
        }

        function cambiarTab(t) { tabActual = t; document.getElementById('tabPen').classList.toggle('active', t === 'pendientes'); document.getElementById('tabPag').classList.toggle('active', t === 'pagados'); renderAlumnos(); }
        function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
        function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

        function generarPDFConTrazabilidad() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            const trazabilidad = new Date().toLocaleString();
            doc.setFontSize(18); doc.setTextColor(95, 150, 115); doc.text("COLEGIO DOMINGO SABIO", 14, 20);
            doc.setFontSize(10); doc.setTextColor(100); doc.text(`REPORTE: ${servicioActivo.nombre} - MES: ${servicioActivo.mes.toUpperCase()}`, 14, 28);
            const rows = alumnos.map(al => [al.nombres_y_apellidos, pagosIDs.includes(al.identificacion) ? "PAGADO" : "PENDIENTE", pagosIDs.includes(al.identificacion) ? `S/ ${servicioActivo.monto}` : "0.00"]);
            doc.autoTable({ startY: 35, head: [['ALUMNO', 'ESTADO', 'MONTO']], body: rows, headStyles: {fillColor: [119, 178, 140]}, theme: 'striped', didDrawPage: (data) => {
                doc.setFontSize(8); doc.text(`Generado por: ${userSession.email} - ${trazabilidad}`, 14, doc.internal.pageSize.height - 10);
            }});
            doc.save(`Reporte_${servicioActivo.mes}.pdf`);
        }

        revisarSesionActiva();
    </script>
</body>
</html>
